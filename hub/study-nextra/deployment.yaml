apiVersion: apps/v1
kind: Deployment
metadata:
  name: study-nextra-deployment
  namespace: study-nextra
spec:
  # 일시 중지(2026-10-05) — 사이트를 내려 둔다. 되살릴 때는 replicas 를 2 로 되돌리고
  # kustomization.yaml 의 monitor.yaml 주석을 푼다.
  replicas: 0
  revisionHistoryLimit: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 3
      maxUnavailable: 0
  selector:
    matchLabels:
      app: study-nextra
  template:
    metadata:
      labels:
        app: study-nextra
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: study-nextra
                # 롤링 업데이트 중 옛 ReplicaSet 파드는 세지 않는다
                matchLabelKeys:
                  - pod-template-hash
                topologyKey: "kubernetes.io/hostname"
      # 노드 분할: node1·node2 에 하나씩. node2 가 없으면 node1 로 돌아온다(ScheduleAnyway)
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          nodeTaintsPolicy: Honor
          labelSelector:
            matchLabels:
              app: study-nextra
          matchLabelKeys:
            - pod-template-hash
      # node2 편입 taint — 풀린 뒤에도 무해
      tolerations:
        - key: node.monthouse/state
          operator: Equal
          value: onboarding
          effect: NoSchedule
      containers:
        - name: study-nextra-container
          image: ghcr.io/idoyo7/study-nextra:latest
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          readinessProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 5
          startupProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 2
            failureThreshold: 30

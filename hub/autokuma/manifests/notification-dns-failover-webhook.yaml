# DNS failover 워크플로(idoyo7/montkim-dns-failover)를 workflow_dispatch 로 깨우는 webhook 알림.
# is_default 는 false — monitor-edge-new-montkim 처럼 notification_name_list 에 명시한 모니터에만 붙는다.
# 본문은 고정 {"ref":"main"} 이다. 방향(edge/hub)은 싣지 않고 워크플로가 직접 관측해 정한다.
# 토큰(fine-grained PAT, Actions: Read and write)은 git 에 두지 않는다 — Secret monitoring/autokuma-github-dispatch
# 를 autokuma Deployment 가 AUTOKUMA__ENV__GITHUB_DISPATCH_TOKEN env 로 읽고 아래 템플릿이 렌더링한다.
# 필드명은 Uptime Kuma 2.5.5 server/notification-providers/webhook.js 기준이다.
# - webhookContentType: custom → webhookCustomBody 를 그대로 전송(axios 가 문자열 본문을 form 으로 보내므로
#   Content-Type 은 헤더에서 application/json 으로 명시)
# - webhookAdditionalHeaders 는 JSON 문자열이어야 한다(JSON.parse)
apiVersion: autokuma.bigboot.dev/v1
kind: KumaEntity
metadata:
  name: dns-failover-webhook
  namespace: monitoring
spec:
  config:
    type: notification
    name: DNS failover webhook
    active: true
    is_default: false
    config:
      type: webhook
      webhookURL: https://api.github.com/repos/idoyo7/montkim-dns-failover/actions/workflows/dns-failover.yml/dispatches
      httpMethod: post
      webhookContentType: custom
      webhookCustomBody: '{"ref":"main"}'
      webhookAdditionalHeaders: "{\"Authorization\": \"Bearer {{ get_env(name='AUTOKUMA__ENV__GITHUB_DISPATCH_TOKEN') }}\", \"Accept\": \"application/vnd.github+json\", \"X-GitHub-Api-Version\": \"2022-11-28\", \"Content-Type\": \"application/json\"}"
      # Kuma 2.x 서버가 저장 시 applyExisting을 덧붙인다(telegram 선례와 동일)
      applyExisting: false

# DNS failover 워크플로(idoyo7/montkim-dns-failover)의 결과 수신용 push 모니터.
# 뜻은 "워크플로가 살아 있나"가 아니라 "DNS 가 지금 어디를 가리키나"다.
#   UP   = edge 서빙 (워크플로가 성공했고 serving=edge)
#   DOWN = hub 로 넘어가 있음 (워크플로가 성공했고 serving=hub)
# 실패한 실행은 보고하지 않는다(실패 알림은 GitHub 기본 알림이 맡는다).
# Kuma 는 상태가 바뀔 때만 알림을 보내고 resend_interval 은 0 이므로, 알림은 edge→hub 전환 때
# 한 번(DOWN), hub→edge 복귀 때 한 번(UP)만 나간다. max_retries 0 이라 전환 보고는 바로 알린다.
# "No heartbeat in the time window" 알림은 창을 최대로 키워 사실상 울리지 않게 했다.
#   interval, retry_interval 2073600초(24일): Kuma 2.5.5 에는 interval 상한(MAX_INTERVAL_SECOND)이
#   없고 하한(MIN_INTERVAL_SECOND = 1)만 있다(src/util.ts, server/model/monitor.js validate()).
#   타이머는 unlimited-timeout 으로 돌아 32비트 한계가 없다(package.json). 2073600 은 이전 메이저의
#   상한으로 알려진 값이라 보수적 상한으로 삼았다(2^31 ms 안에도 든다).
#   autokuma 2.0.0 과 KumaEntity CRD 는 이 값을 제한하지 않는다.
# 경위: 2026-10-04 에 GitHub 의 schedule 실행이 cron 대로 돌지 않아 간격이 3시간을 넘었다.
# interval 7500(약 2시간 5분)에서는 장애가 아닌 "push 없음" 알림이 하루에 세 번 왔고, 24시간 창으로
# 넓혔다가 보고의 뜻 자체를 위와 같이 바꾸면서 최댓값으로 올렸다.
# 토큰은 git 에 두지 않는다 — Secret monitoring/autokuma-push-tokens 를 autokuma Deployment 가
# AUTOKUMA__ENV__PUSH_DNS_FAILOVER env 로 읽고, 아래 템플릿이 렌더링한다. 토큰은 영문·숫자 32자여야 한다.
# 알림은 Deployment 의 AUTOKUMA__DEFAULT_SETTINGS(push.notification_name_list)로 telegram 만 걸린다.
apiVersion: autokuma.bigboot.dev/v1
kind: KumaEntity
metadata:
  name: dns-failover-result
  namespace: monitoring
spec:
  config:
    type: push
    name: dns failover 전환 상태
    push_token: "{{ get_env(name='AUTOKUMA__ENV__PUSH_DNS_FAILOVER') }}"
    interval: 2073600
    max_retries: 0
    retry_interval: 2073600

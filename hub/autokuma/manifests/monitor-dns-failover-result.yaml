# DNS failover 워크플로(idoyo7/montkim-dns-failover)의 결과 수신용 push 모니터.
# 워크플로가 끝에서 /api/push/<token>?status=up|down 을 보낸다.
# 두 가지를 따로 잡는다.
#   1) 실행은 됐는데 실패: 워크플로가 status=down 을 보낸다. max_retries 0 이라 바로 알린다.
#   2) 실행 자체가 멈춤: 24시간 동안 push 가 없으면 down.
# interval 을 86400(24시간)으로 둔 이유: cron 은 매시 17분이지만 GitHub 의 schedule 실행은
# 지연되거나 빠진다. 2026-10-04 에 실제로 14:23, 18:11, 21:21(UTC)에만 돌아 간격이 3시간을 넘었고,
# interval 7500(약 2시간 5분)에서는 "No heartbeat in the time window" 알림이 하루에 세 번 왔다.
# 그 알림은 장애가 아니라 스케줄 지연이었다.
# 토큰은 git 에 두지 않는다 — Secret monitoring/autokuma-push-tokens 를 autokuma Deployment 가
# AUTOKUMA__ENV__PUSH_DNS_FAILOVER env 로 읽고, 아래 템플릿이 렌더링한다. 토큰은 영문·숫자 32자여야 한다.
# 알림은 Deployment 의 AUTOKUMA__DEFAULT_SETTINGS(push.notification_name_list)로 telegram 만 걸린다.
apiVersion: autokuma.bigboot.dev/v1
kind: KumaEntity
metadata:
  name: dns-failover-result
  namespace: monitoring
spec:
  config:
    type: push
    name: dns failover workflow
    push_token: "{{ get_env(name='AUTOKUMA__ENV__PUSH_DNS_FAILOVER') }}"
    interval: 86400
    max_retries: 0
    retry_interval: 86400

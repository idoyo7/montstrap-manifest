apiVersion: apps/v1
kind: Deployment
metadata:
  name: autokuma
  namespace: monitoring
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: autokuma
  template:
    metadata:
      labels:
        app: autokuma
    spec:
      serviceAccountName: autokuma
      containers:
        - name: autokuma
          image: ghcr.io/bigboot/autokuma:2.0.0
          env:
            # 내부 인증은 비활성화됨(Keycloak SSO가 유일한 게이트) — 계정 불필요
            - name: AUTOKUMA__KUMA__URL
              value: http://kuma-uptime-kuma.monitoring.svc:3001
            - name: AUTOKUMA__KUBERNETES__ENABLED
              value: "true"
            - name: AUTOKUMA__DOCKER__ENABLED
              value: "false"
            - name: AUTOKUMA__FILES__ENABLED
              value: "false"
            # http·push 모니터에 telegram 알림(KumaEntity monitoring/telegram)을 기본 적용
            # (줄마다 `<type>.<필드>: 값` 한 항목)
            - name: AUTOKUMA__DEFAULT_SETTINGS
              value: |-
                http.notification_name_list: ["telegram"]
                push.notification_name_list: ["telegram"]
            # AUTOKUMA__ENV__ 프리픽스만 KumaEntity 템플릿 get_env()에서 접근 허용됨
            - name: AUTOKUMA__ENV__TELEGRAM_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: autokuma-telegram
                  key: bot-token
            - name: AUTOKUMA__ENV__TELEGRAM_CHAT_ID
              valueFrom:
                secretKeyRef:
                  name: autokuma-telegram
                  key: chat-id
            # edge·hub healthcheck push 모니터 토큰. Secret 이 아직 없어도 파드는 뜬다
            # (해당 KumaEntity 만 get_env 렌더링 실패로 건너뜀)
            - name: AUTOKUMA__ENV__PUSH_EDGE_NODE
              valueFrom:
                secretKeyRef:
                  name: autokuma-push-tokens
                  key: AUTOKUMA__ENV__PUSH_EDGE_NODE
                  optional: true
            - name: AUTOKUMA__ENV__PUSH_EDGE_CERT
              valueFrom:
                secretKeyRef:
                  name: autokuma-push-tokens
                  key: AUTOKUMA__ENV__PUSH_EDGE_CERT
                  optional: true
            - name: AUTOKUMA__ENV__PUSH_EDGE_TIMER
              valueFrom:
                secretKeyRef:
                  name: autokuma-push-tokens
                  key: AUTOKUMA__ENV__PUSH_EDGE_TIMER
                  optional: true
            - name: AUTOKUMA__ENV__PUSH_HUB_NODE
              valueFrom:
                secretKeyRef:
                  name: autokuma-push-tokens
                  key: AUTOKUMA__ENV__PUSH_HUB_NODE
                  optional: true
            - name: AUTOKUMA__ENV__PUSH_HUB_CERT
              valueFrom:
                secretKeyRef:
                  name: autokuma-push-tokens
                  key: AUTOKUMA__ENV__PUSH_HUB_CERT
                  optional: true
            # DNS failover: GitHub workflow_dispatch 용 PAT(webhook 알림 헤더)와 결과 수신 push 모니터 토큰.
            # 둘 다 optional — Secret 이 없어도 파드는 뜨고, get_env 렌더링이 실패하는 해당 KumaEntity 만 건너뛴다
            - name: AUTOKUMA__ENV__GITHUB_DISPATCH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: autokuma-github-dispatch
                  key: token
                  optional: true
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              memory: 256Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: autokuma-data

apiVersion: autokuma.bigboot.dev/v1
kind: KumaEntity
metadata:
  name: telegram
  namespace: monitoring
spec:
  config:
    type: notification
    name: Telegram
    active: true
    is_default: true
    # 토큰·chat id는 git에 두지 않는다 — autokuma Deployment의
    # AUTOKUMA__ENV__* env(클러스터 native Secret 참조)에서 렌더링된다
    config:
      type: telegram
      telegramBotToken: "{{ get_env(name='AUTOKUMA__ENV__TELEGRAM_BOT_TOKEN') }}"
      telegramChatID: "{{ get_env(name='AUTOKUMA__ENV__TELEGRAM_CHAT_ID') }}"
      # Kuma 2.x 서버가 저장 시 applyExisting을 덧붙인다 — 여기 없으면
      # AutoKuma 비교가 매 사이클 불일치로 판정해 5초마다 재업데이트한다
      applyExisting: false

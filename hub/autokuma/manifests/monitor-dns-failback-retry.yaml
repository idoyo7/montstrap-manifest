# DNS failover 의 "복귀 재시도" 모니터. dns-serving-site 와 같은 확인(공개 DNS 가 hub IP 로 답하면 DOWN)을 하되,
# 알림은 dns-failover-webhook 만 붙는다(telegram 없음 — 사람에게 가는 알림은 dns-serving-site 가 낸다).
#
# 목적: 워크플로의 예약 실행(cron)이 없어졌으므로, edge 가 돌아온 직후의 복귀 판정이 실패했거나
# (edge 로 10회 확인 중 하나라도 실패하면 워크플로는 hub 를 유지한다) 복귀 webhook 이 유실됐을 때
# DNS 가 hub 에 눌러앉는다. 이를 막기 위해 DNS 가 hub 를 가리키는 동안에만 워크플로를 다시 깨운다.
# resend_interval 30: DOWN 이 이어지는 동안 30 번째 heartbeat(60초 간격이라 약 30분)마다 webhook 을 다시 보낸다.
# DNS 가 edge 로 돌아오면 UP 이 되어 재시도가 멈춘다(문제가 없을 때는 아무것도 보내지 않는다).
#
# 확인 방식(invert_keyword)과 max_retries 의 이유는 dns-serving-site 머리 주석과 같다.
# 모니터 생성 직후 첫 heartbeat 는 상태와 무관하게 알림을 보내므로(Uptime Kuma 의 isFirstBeat) 생성 때
# 워크플로가 한 번 실행되는데, edge 서빙 중이면 "변경 없음" 으로 끝난다.
# type 이 keyword 라 Deployment 의 기본 알림(http·push 의 telegram)이 붙지 않으므로 telegram 은 붙지 않는다.
apiVersion: autokuma.bigboot.dev/v1
kind: KumaEntity
metadata:
  name: dns-failback-retry
  namespace: monitoring
spec:
  config:
    type: keyword
    name: dns failover 복귀 재시도
    url: https://dns.google/resolve?name=montkim.com&type=A
    keyword: 110.8.191.30
    invert_keyword: true
    accepted_statuscodes:
      - 200-299
    interval: 60
    max_retries: 3
    retry_interval: 60
    resend_interval: 30
    notification_name_list:
      - dns-failover-webhook

apiVersion: apps/v1
kind: Deployment
metadata:
  name: wedding-invitation-external-deployment
  namespace: wedding-invitation-external
spec:
  replicas: 2
  revisionHistoryLimit: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 2
      maxUnavailable: 0
  selector:
    matchLabels:
      app: wedding-invitation-external
  template:
    metadata:
      labels:
        app: wedding-invitation-external
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: wedding-invitation-external
                # 롤링 업데이트 중 옛 ReplicaSet 파드는 세지 않는다
                matchLabelKeys:
                  - pod-template-hash
                topologyKey: "kubernetes.io/hostname"
      # 노드 분할: node1·node2 에 하나씩. node2 가 없으면 node1 로 돌아온다(ScheduleAnyway)
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          nodeTaintsPolicy: Honor
          labelSelector:
            matchLabels:
              app: wedding-invitation-external
          matchLabelKeys:
            - pod-template-hash
      # node2 편입 taint — 풀린 뒤에도 무해
      tolerations:
        - key: node.monthouse/state
          operator: Equal
          value: onboarding
          effect: NoSchedule
      containers:
        - name: wedding-invitation-external-container
          image: montkim9/invi2
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "2"
              memory: "512Mi"
          env:
            - name: NEXT_PUBLIC_ENABLE_NEXT_IMAGE_OPTIMIZATION
              value: "true"
          # HyperDX 브라우저 RUM 키 — 앱의 /api/rum-config 가 런타임 env 로 읽어 클라이언트에 넘긴다.
          # Secret 은 git 밖(hub 클러스터 hyperdx-rum, 키 HYPERDX_API_KEY/HYPERDX_URL). 없으면 RUM 비활성.
          envFrom:
            - secretRef:
                name: hyperdx-rum
                optional: true
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            periodSeconds: 5
          startupProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 3
            periodSeconds: 1

          ports:
            - containerPort: 3000

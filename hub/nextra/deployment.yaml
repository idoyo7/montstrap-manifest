apiVersion: apps/v1
kind: Deployment
metadata:
  name: nextra-deployment
  namespace: nextra
spec:
  replicas: 2
  revisionHistoryLimit: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 3
      maxUnavailable: 0
  selector:
    matchLabels:
      app: nextra
  template:
    metadata:
      labels:
        app: nextra
      annotations:
        # OTel Node.js auto-instrumentation (중앙 CR: monitoring/mont-instrumentation)
        instrumentation.opentelemetry.io/inject-nodejs: "monitoring/mont-instrumentation"
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: nextra
                # 롤링 업데이트 중 옛 ReplicaSet 파드는 세지 않는다
                matchLabelKeys:
                  - pod-template-hash
                topologyKey: "kubernetes.io/hostname"
      # 노드 분할: node1·node2 에 하나씩. node2 가 없으면 node1 로 돌아온다(ScheduleAnyway)
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          nodeTaintsPolicy: Honor
          labelSelector:
            matchLabels:
              app: nextra
          matchLabelKeys:
            - pod-template-hash
      # node2 편입 taint — 풀린 뒤에도 무해
      tolerations:
        - key: node.monthouse/state
          operator: Equal
          value: onboarding
          effect: NoSchedule
      containers:
        - name: nextra-container
          image: idoyo7/nextra-blog:ef553d
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            periodSeconds: 5
          startupProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 3
            periodSeconds: 2
            failureThreshold: 30

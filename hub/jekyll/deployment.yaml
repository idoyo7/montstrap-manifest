apiVersion: apps/v1
kind: Deployment
metadata:
  name: jekyll-deployment
  namespace: jekyll
spec:
  replicas: 2
  revisionHistoryLimit: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 3
      maxUnavailable: 0
  selector:
    matchLabels:
      app: jekyll
  template:
    metadata:
      labels:
        app: jekyll
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: jekyll
                # 롤링 업데이트 중 옛 ReplicaSet 파드는 세지 않는다
                matchLabelKeys:
                  - pod-template-hash
                topologyKey: "kubernetes.io/hostname"
      # 노드 분할: node1·node2 에 하나씩. node2 가 없으면 node1 로 돌아온다(ScheduleAnyway)
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          nodeTaintsPolicy: Honor
          labelSelector:
            matchLabels:
              app: jekyll
          matchLabelKeys:
            - pod-template-hash
      # node2 편입 taint — 풀린 뒤에도 무해
      tolerations:
        - key: node.monthouse/state
          operator: Equal
          value: onboarding
          effect: NoSchedule
      containers:
        - name: jekyll-container
          image: montkim9/jekyll   # tag injected by kustomize (images[].newTag)
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 20
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 20
            periodSeconds: 5
          ports:
            - containerPort: 80


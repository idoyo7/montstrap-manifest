apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: study-hugo-virtualservice
  namespace: study-hugo
spec:
  hosts:
  - study-hugo.makgol.com
  - hugo.makgol.com
  - docs.makgol.com
  gateways:
  - istio-system/makgol-gateway
  http:
  - name: redirect-legacy-host
    match:
    - authority:
        exact: study-hugo.makgol.com
    redirect:
      authority: hugo.makgol.com
      redirectCode: 301
  - name: serve-hugo
    match:
    - uri:
        prefix: /
    route:
    - destination:
        host: study-hugo-service
        port:
          number: 80
    timeout: 30s
    retries:
      attempts: 3
      perTryTimeout: 10s

# palworld-admin 웹앱 전용 ServiceAccount + 최소 권한(palworld 네임스페이스 한정).
# 읽기(상태/설정/로그) + 업데이트 Job 생성만. 서버 scale 권한은 없음
# (scale 은 트리거되는 palworld-update Job 의 palworld-updater SA 가 별도 보유).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: palworld-admin
  namespace: palworld
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: palworld-admin
  namespace: palworld
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get"]
  - apiGroups: ["batch"]
    resources: ["cronjobs"]
    verbs: ["get"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: palworld-admin
  namespace: palworld
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: palworld-admin
subjects:
  - kind: ServiceAccount
    name: palworld-admin
    namespace: palworld
